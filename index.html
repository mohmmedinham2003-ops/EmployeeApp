<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <h1>Employee Management</h1>
    <h3>All Employee List</h3>

    <table border="1" id="tblEmployeeDetails">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Phone</th>
            <th>Gender</th>
            <th>Date Joined</th>
            <th>Type</th>
            <th>Salary</th>
            <th>Department</th>
            <th>Designation</th>
        </tr>

    </table>

    <br><br>

    <label>Department: </label>

    <select id="drpDepartment" onchange="drpDesignation">
        <option value="">Select Department</option>

    </select>

    <br><br>

    <label for="">Designation: </label>
    <select id="drpDesignation">
        <option value="">select Designation</option>
    </select>

    <script src="/employee.js"></script>
</body>

</html>
