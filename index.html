<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Document</title>
</head>

<body class="flex-sm-nowrap">
    <h1 class="bg-success text text-center">Employee Management</h1>

    <div>
<br>
        <div class="row">
            <div class="col-7">
                <div class=" card">
                    <h3 class="text-center">All Employee List</h3>

                    <table class="table table-bordered" border="1" id="tblEmployeeDetails">
                        <tr>
                            <th>ID</th>
                            <th>Name</th>
                            <th>Email</th>
                            <th>Phone</th>
                            <th>Gender</th>
                            <th>Date Joined</th>
                            <th>Type</th>
                            <th>Salary</th>
                            <th>Department</th>
                            <th>Designation</th>
                            <th>Action</th>
                        </tr>

                    </table>
                </div>

            </div>

            <div class="col-5">
                <form class="card container p-3">

                    <h1 class="text-center">Add Employee</h1>

                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" id="txtEmpFullName">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" id="txtEmpEmail">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Phone</label>
                        <input type="text" class="form-control" id="txtEmpPhone">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Gender</label>
                        <select class="form-control" id="drpGender">
                            <option value="">Select Gender</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Date of Joining</label>
                        <input type="date" class="form-control" id="txtDateOfJoining">
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Department</label>

                        <select class="form-control" id="drpDepartment" onchange="getDesignation()">
                            <option value="">Select Department</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Designation</label>

                        <select class="form-control" id="drpDesignation">
                            <option value="">Select Designation</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Employee Type</label>

                        <select class="form-control" id="drpEmployeeType">
                            <option value="">Select Employee Type</option>
                            <option value="Permanent">Permanent</option>
                            <option value="Contract">Contract</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Salary</label>
                        <input type="number" class="form-control" id="txtSalary">
                    </div>


                    <div>
                        <div class="row">
                            <div class="col-2">
                                <div class="mb-3 text-center ">
                                    <button type="button" class="btn btn-success" onclick="createEmployee()">
                                        Add Employee
                                    </button>
                                </div>

                            </div>

                            <div class="col-3">
                                <div class="mb-3 text-center">
                                    <button type="button" class="btn btn-primary" onclick="updateEmployee()">
                                        Update Employee
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>


                </form>
            </div>
        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
    <script src="/employee.js"></script>
</body>

</html>
